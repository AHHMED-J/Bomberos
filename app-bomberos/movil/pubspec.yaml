name: bomberos_parte
description: "Parte digital · Bomberos de Ensenada. Esqueleto de la app iOS (UABC FIAD, Tecnologías Emergentes)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Estado e inyección de dependencias: un solo lugar (lib/servicios/proveedores.dart).
  flutter_riverpod: ^3.5.0
  # Navegación declarativa con rutas por nombre.
  go_router: ^18.1.4
  # Partes en progreso y audios por enviar en SQLite local del teléfono.
  sqflite: ^2.4.6
  path: ^1.9.1
  # Cliente HTTP hacia app-bomberos/servidor.
  http: ^1.6.0
  # Llave ECDSA en el Secure Enclave + Face ID (probado en probandoFlutter/).
  biometric_signature: ^13.3.0
  # SHA-256 del contenido del parte para el reto de firma.
  crypto: ^3.0.8
  flutter_localizations:
    sdk: flutter
  record: ^7.1.2
  path_provider: ^2.1.6
  wakelock_plus: ^1.8.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fuentes/Barlow-Regular.ttf
        - asset: assets/fuentes/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fuentes/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fuentes/Barlow-Bold.ttf
          weight: 700
    - family: BarlowCondensed
      fonts:
        - asset: assets/fuentes/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fuentes/BarlowCondensed-Bold.ttf
          weight: 700
