name: Publicar GitHub Pages

# Despliega primera-version/docs/ (el sitio ya no vive en la raíz del repo,
# así que "Deploy from a branch" no puede apuntar aquí — necesita Actions).
on:
  push:
    branches: [main]
    paths:
      - "primera-version/docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Subir primera-version/docs/ como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: "primera-version/docs"

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
